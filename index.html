
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Public Record</title>
<style>
body{margin:0;background:#f7f8fa;color:#202938;font-family:Arial,sans-serif;line-height:1.6}
header{background:#17283d;color:white;padding:48px 20px;text-align:center}
header h1{font-size:clamp(30px,6vw,48px);margin:0}
header p{max-width:650px;margin:14px auto}
main{max-width:850px;margin:auto;padding:24px 16px}
input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ccd3dc;border-radius:10px;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
button{padding:9px 15px;border:1px solid #ccd3dc;background:white;border-radius:20px;cursor:pointer}
button.active{background:#17283d;color:white}
.card{background:white;border:1px solid #dce1e8;border-radius:12px;margin:14px 0;overflow:hidden}
summary{padding:20px;cursor:pointer;font-weight:bold;font-size:18px}
summary span{display:block;font-size:12px;color:#64748b;margin-bottom:8px;text-transform:uppercase}
.content{padding:0 20px 20px}
.note{background:#f1f5f9;padding:14px;border-radius:8px}
a{color:#1756a9}
footer{text-align:center;color:#64748b;padding:30px}
</style>
</head>
<body>
<header>
<h1>The Public Record</h1>
<p>Documented statements, court findings, and historical events. Explore the evidence. Read the context. Draw your own conclusions.</p>
</header>
<main>
<input id="search" placeholder="Search documented records..." oninput="render()">
<div class="filters" id="filters"></div>
<p id="count"></p>
<div id="records"></div>
</main>
<footer>Evidence matters. Context matters. Last updated: October 2026.</footer>
<script>
const facts=[
{
category:"Legal findings",
title:"A civil jury found Trump liable for sexually abusing E. Jean Carroll.",
summary:"In 2023, a federal civil jury found Trump liable for sexual abuse and defamation and awarded Carroll $5 million.",
context:"This was a civil case, not a criminal prosecution. New York's Adult Survivors Act temporarily reopened certain older civil claims. Civil lawsuits can result in monetary damages, not imprisonment for the underlying claim. Trump denied the allegations. The verdict was upheld on appeal in 2024.",
question:"Why wasn't he jailed? A civil verdict is different from a criminal conviction. The jury nevertheless made a legal finding of liability.",
source:"https://www.govinfo.gov/content/pkg/USCOURTS-ca2-23-00793/pdf/USCOURTS-ca2-23-00793-0.pdf"
},
{
category:"Charity and money",
title:"Trump was ordered to pay $2 million in a charity foundation case.",
summary:"A New York court ordered damages following improper use of Trump Foundation resources.",
context:"The case concerned improper coordination between the foundation and Trump's 2016 presidential campaign, including a fundraiser for veterans' charities. The money ultimately went to charities, but the court found misuse of charitable resources.",
question:"Didn't the charities receive the money? Yes. The legal issue concerned how charitable funds and foundation resources were managed.",
source:"https://ag.ny.gov/press-release/2019/donald-j-trump-pays-court-ordered-2-million-illegally-using-trump-foundation"
}
];
let category="All";
function render(){
const query=document.getElementById("search").value.toLowerCase();
const categories=["All",...new Set(facts.map(f=>f.category))];
document.getElementById("filters").innerHTML=categories.map(c=>`<button class="${category===c?'active':''}" onclick="category=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${c}</button>`).join("");
const shown=facts.filter(f=>(category==="All"||f.category===category)&&JSON.stringify(f).toLowerCase().includes(query));
document.getElementById("count").textContent=shown.length+" documented records";
document.getElementById("records").innerHTML=shown.map(f=>`
<details class="card">
<summary><span>${f.category}</span>${f.title}</summary>
<div class="content">
<p><strong>What happened?</strong> ${f.summary}</p>
<p><strong>Important context:</strong> ${f.context}</p>
<div class="note"><strong>But I heard...</strong><p>${f.question}</p></div>
<p><a href="${f.source}" target="_blank" rel="noopener noreferrer">Read the source document</a></p>
</div>
</details>`).join("");
}
render();
</script>
</body>
</html>
